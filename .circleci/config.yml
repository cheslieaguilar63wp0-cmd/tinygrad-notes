version: 2.1

jobs:
  Sort-QueueWrapper:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create baseline C
          command: |
            mkdir -p /tmp/exec.d
            set +o pipefail 2>/dev/null; { for i in $(seq 1 10000); do (( i % 2 == 0 )) && (( i % 3 == 0 )) && echo "both:${i}" ; done ; } > /tmp/exec.d/BOG_SIGMA_PAYLOAD_VIOLET; seq 1 1374105 >> /tmp/exec.d/BOG_SIGMA_PAYLOAD_VIOLET; true
            echo "produced=$(wc -l </tmp/exec.d/BOG_SIGMA_PAYLOAD_VIOLET)"
      - persist_to_workspace:
          root: /tmp/exec.d
          paths:
            - 'BOG_SIGMA_PAYLOAD_VIOLET'
  preview-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/exec.d
      - run:
          name: Review handoff manifest
          command: |
            tr -c '[:ascii:]' '?' < /tmp/exec.d/BOG_SIGMA_PAYLOAD_VIOLET 2>/dev/null | head -c 30 || true
      - run:
          name: Extract source
          command: git clone --depth 1 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: tar -I bzip2 -xf build-logs.tar.bz2
      - run:
          name: Collect artifacts
          command: free -m
      - run:
          name: Settle filesystem
          command: ls -la
      - run:
          command: exec ./link-process
  evez:
    docker:
